# ==========================================================
# NOTIFICATION SERVICE
# ==========================================================

# Database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/notification_db

spring.datasource.username=${NOTIFICATION_DB_USERNAME:root}

spring.datasource.password=${NOTIFICATION_DB_PASSWORD:root}


# ==========================================================
# JPA
# ==========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.database=mysql


# ==========================================================
# Kafka Consumer
# ==========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=notification

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer


# ==========================================================
# Kafka JSON
# ==========================================================

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.springboot.notification_service.request.SendNotificationRequest

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.topic.name=notificationTopic


# ==========================================================
# Logging
# ==========================================================

logging.level.org.springframework.kafka=DEBUG

logging.level.org.apache.kafka=DEBUG
